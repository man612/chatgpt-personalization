name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Lint tracked profiles
        run: python tools/profile.py lint profiles/presets/*.json profiles/maintainers/*.json profiles/operational/*.json
      - name: Render neutral Blank smoke test
        run: python tools/profile.py render profiles/presets/blank.json --out build/blank --limit 1500
      - name: Render General smoke test at Free/Go limit
        run: python tools/profile.py render profiles/presets/general.json --out build/general --limit 1500
      - name: Render maintainer reference smoke test
        run: python tools/profile.py render profiles/maintainers/yasman.json --out build/yasman-reference --limit 5000
      - name: Render operational profile smoke test
        run: python tools/profile.py render profiles/operational/yasman.json --out build/yasman-operational --limit 5000

  browser:
    name: Browser renderer parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check docs/i18n.js
          node --check docs/renderer.js
          node --check docs/app.js
          node --check docs/motion.js
          node --check docs/mobile.js
          node --check tests/render_profile.js
          node --check tests/validate_profile.js
          node --check tests/e2e/builder.spec.js
      - name: Check committed Pages data snapshots
        run: python tools/sync_docs_data.py --check
      - name: Compare browser and Python renderers
        run: python tests/check_renderer_parity.py
      - name: Compare browser and Python validators
        run: python tests/check_validator_parity.py
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        run: npm run test:e2e
