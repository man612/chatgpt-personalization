name: Profile proposal
description: Propose a reusable example profile or a meaningful improvement to an existing one.
title: "profile: "
labels: ["profile"]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Distinct use case
      description: Who is this for, and why are the current profiles insufficient?
    validations:
      required: true
  - type: textarea
    id: layers
    attributes:
      label: Affected layers
      description: Does this change product settings, durable identity/context, response instructions, or more than one layer?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observable behavior
      description: What should change in responses, and which regression scenario would demonstrate it?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Contribution checks
      options:
        - label: The profile is reusable or is intentionally documented as a public maintainer example.
          required: true
        - label: It contains no secrets, confidential information, or unnecessary personal data.
          required: true
        - label: It differs materially from existing profiles.
          required: true
        - label: I can provide at least one evaluation scenario or explain which existing scenario covers the change.
          required: true
