name: Preset proposal
description: Propose a reusable public preset or a meaningful improvement to an existing preset.
title: "preset: "
labels: ["profile"]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Reusable use case
      description: Who is this preset for, and why are the current presets insufficient?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observable behavior
      description: What should change in responses, and which regression scenario demonstrates the need?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Contribution checks
      options:
        - label: The preset is generic and contains no real person's identity, employer, client data, secrets, or confidential information.
          required: true
        - label: The proposal differs materially from existing presets.
          required: true
        - label: I can provide or update at least one evaluation scenario for the behavior change.
          required: true
