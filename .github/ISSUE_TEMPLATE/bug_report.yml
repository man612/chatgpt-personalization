name: Bug report
description: Report a reproducible problem in the browser builder, CLI, renderer, schema, or tests.
title: "bug: "
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Browser builder
        - CLI / linter
        - Renderer / schema
        - Tests / CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest reproducible steps and a non-sensitive profile when relevant.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser/version and OS/device for builder bugs; Python version for CLI bugs.
      placeholder: "Chrome 152 on Windows 11 / Python 3.12"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials and sensitive personal information.
          required: true
