<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT Personalization</title>
  <desc id="desc">A public-first personalization toolkit for presets, profiles, validation, rendering, and behavioral evaluation.</desc>
  <rect width="1200" height="460" rx="28" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="458" rx="27" fill="none" stroke="#30363d" stroke-width="2"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="70" y="82" font-size="16" font-weight="700" letter-spacing="2.6" fill="#3fb950">PERSONALIZATION TOOLKIT · V2</text>
    <text x="70" y="145" font-size="50" font-weight="760" fill="#f0f6fc">Make ChatGPT fit</text>
    <text x="70" y="202" font-size="50" font-weight="760" fill="#f0f6fc">the way you work.</text>
    <text x="70" y="250" font-size="22" font-weight="400" fill="#8b949e">Start from an anonymous preset, shape a profile,</text>
    <text x="70" y="282" font-size="22" font-weight="400" fill="#8b949e">then validate, render, and evaluate the behavior.</text>

    <g transform="translate(70 330)">
      <rect width="130" height="40" rx="20" fill="#12261a" stroke="#238636"/>
      <text x="65" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#7ee787">PUBLIC-FIRST</text>
      <rect x="142" width="148" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
      <text x="216" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f6fc">NO RUNTIME DEPS</text>
      <rect x="302" width="128" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
      <text x="366" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f6fc">JSON SCHEMA</text>
      <rect x="442" width="154" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
      <text x="519" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f6fc">BEHAVIORAL EVALS</text>
    </g>

    <g transform="translate(745 52)">
      <rect x="0" y="0" width="390" height="356" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <text x="28" y="42" font-size="13" font-weight="700" letter-spacing="1.6" fill="#8b949e">WORKFLOW</text>

      <g transform="translate(28 68)">
        <rect width="334" height="70" rx="14" fill="#0d1117" stroke="#30363d"/>
        <circle cx="34" cy="35" r="17" fill="#238636"/>
        <text x="34" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
        <text x="64" y="29" font-size="13" font-weight="700" fill="#f0f6fc">START</text>
        <text x="64" y="51" font-size="15" fill="#8b949e">Choose an anonymous preset</text>
      </g>

      <path d="M195 141v24" stroke="#6e7681" stroke-width="2" stroke-linecap="round"/>
      <path d="M188 158l7 8 7-8" fill="none" stroke="#6e7681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(28 170)">
        <rect width="334" height="82" rx="14" fill="#0d1117" stroke="#30363d"/>
        <circle cx="34" cy="41" r="17" fill="#1f6feb"/>
        <text x="34" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
        <text x="64" y="28" font-size="13" font-weight="700" fill="#f0f6fc">PERSONALIZE</text>
        <text x="64" y="49" font-size="15" fill="#8b949e">product · identity · instructions</text>
        <text x="64" y="68" font-size="13" fill="#6e7681">keep private profiles local by default</text>
      </g>

      <path d="M195 255v24" stroke="#6e7681" stroke-width="2" stroke-linecap="round"/>
      <path d="M188 272l7 8 7-8" fill="none" stroke="#6e7681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(28 284)">
        <rect width="334" height="48" rx="14" fill="#12261a" stroke="#238636"/>
        <text x="22" y="30" font-size="13" font-weight="700" fill="#7ee787">3 · VALIDATE · RENDER · EVALUATE</text>
      </g>
    </g>
  </g>
</svg>
