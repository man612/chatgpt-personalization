<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Public-first profile architecture</title>
  <desc id="desc">Anonymous presets feed private local profiles or public maintainer examples, then render product settings and ChatGPT instruction fields.</desc>
  <rect width="1200" height="330" rx="24" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="328" rx="23" fill="none" stroke="#30363d" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="54" y="54" font-size="15" font-weight="700" letter-spacing="2" fill="#8b949e">PUBLIC-FIRST ARCHITECTURE</text>
    <g transform="translate(54 84)"><rect width="236" height="176" rx="18" fill="#161b22" stroke="#30363d"/><text x="22" y="35" font-size="13" font-weight="700" fill="#3fb950">01 · PRESETS</text><text x="22" y="68" font-size="23" font-weight="700" fill="#f0f6fc">Anonymous starts</text><text x="22" y="99" font-size="14" fill="#8b949e">blank · student</text><text x="22" y="123" font-size="14" fill="#8b949e">tech · design · writing</text><rect x="22" y="142" width="118" height="26" rx="13" fill="#12261a"/><text x="81" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#7ee787">REUSABLE</text></g>
    <path d="M306 172h86" stroke="#6e7681" stroke-width="2" stroke-linecap="round"/><path d="M382 165l10 7-10 7" fill="none" stroke="#6e7681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(408 84)"><rect width="304" height="176" rx="18" fill="#161b22" stroke="#30363d"/><text x="22" y="35" font-size="13" font-weight="700" fill="#58a6ff">02 · PROFILE</text><text x="22" y="68" font-size="23" font-weight="700" fill="#f0f6fc">Your source of truth</text><text x="22" y="100" font-size="14" fill="#8b949e">product · identity · instructions</text><rect x="22" y="124" width="116" height="28" rx="14" fill="#102a44"/><text x="80" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="#79c0ff">LOCAL / PRIVATE</text><rect x="148" y="124" width="134" height="28" rx="14" fill="#2d2406"/><text x="215" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="#e3b341">MAINTAINER EXAMPLE</text></g>
