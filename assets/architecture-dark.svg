    <g transform="translate(830 84)"><rect width="316" height="176" rx="18" fill="#161b22" stroke="#30363d"/><text x="22" y="35" font-size="13" font-weight="700" fill="#a371f7">03 · OUTPUT</text><text x="22" y="68" font-size="23" font-weight="700" fill="#f0f6fc">Ready to install</text><text x="22" y="100" font-size="14" fill="#8b949e">settings.md · occupation.txt</text><text x="22" y="123" font-size="14" fill="#8b949e">about-you · custom-instructions</text><rect x="22" y="142" width="168" height="26" rx="13" fill="#271c3d"/><text x="106" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#d2a8ff">VALIDATE + EVALUATE</text></g>
